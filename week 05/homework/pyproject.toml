[project]
name = "trivia-agent"
version = "0.1.0"
description = "A trivia quiz agent with monitoring and observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pydantic-ai>=0.0.1",
    "logfire>=0.1.0",
    "questionary>=2.0.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
