[project]
name = "recipe-eval-agent"
version = "0.1.0"
description = "Week 06 homework: evaluate a recipe assistant agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "minsearch>=0.0.4",
    "pydantic-ai>=0.0.14",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
